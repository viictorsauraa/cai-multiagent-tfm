[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cai-framework"
version = "0.5.10"
description = "Cybersecurity AI Framework (TFM fork)"
requires-python = ">=3.9"
license = "MIT"
authors = [
    { name = "Alias Robotics", email = "research@aliasrobotics.com" },
]

dependencies = [
    "dnspython",
    "dotenv>=0.9.9",
    "flask",
    "folium>=0.15.0,<1",
    "griffe>=1.5.6,<2",
    "litellm[proxy]>=1.63.7",
    "mako>=1.3.8",
    "matplotlib>=3.0,<4",
    "mcp; python_version>='3.10'",
    "mkdocs>=1.6.0",
    "mkdocs-material>=9.6.0",
    "networkx",
    "numpy>=1.21,<3",
    "openai==1.75.0",
    "openinference-instrumentation-openai>=0.1.22",
    "pandas>=1.3,<3",
    "paramiko>=3.5.1",
    "prompt-toolkit>=3.0.39",
    "pydantic>=2.10,<3",
    "pypdf2",
    "requests>=2.0,<3",
    "rich>=13.9.4",
    "types-requests>=2.0,<3",
    "typing-extensions>=4.12.2,<5",
    "wasabi>=1.1.3",
]

[project.optional-dependencies]
viz = ["graphviz>=0.17"]
voice = [
    "numpy>=2.2.0,<3; python_version>='3.10'",
    "websockets>=15.0,<16",
]

[project.scripts]
cai = "cai.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/cai"]
